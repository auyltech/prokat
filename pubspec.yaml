name: prokat
description: "Equipment renting platform in Kazakhstan"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.13+5

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_markdown: ^0.7.3

  flutter_localizations:
    sdk: flutter

  go_router: ^17.1.0
  geolocator: ^14.0.2

  mapbox_maps_flutter: ^2.6.0
  permission_handler: ^11.3.0

  # HTTP client
  dio: ^5.4.3

  # secure token storage
  flutter_secure_storage: ^9.0.0

  # state management
  flutter_riverpod: ^2.5.1

  # utilities
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  lucide_icons: ^0.257.0
  shimmer: ^3.0.0
  url_launcher: ^6.3.2
  socket_io_client: ^3.1.4
  image_picker: ^1.2.1
  image_cropper: ^12.2.1
  pinput: ^6.0.2
  mask_text_input_formatter: ^2.9.0
  firebase_core: ^4.9.0
  firebase_app_check: ^0.4.6
  firebase_messaging: ^16.2.2
  flutter_local_notifications: ^21.0.0
  package_info_plus: ^9.0.1
  uuid: ^4.6.0
  firebase_crashlytics: ^5.2.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0

  change_app_package_name: ^1.5.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/app_icon.png
    - assets/icons/app_icon_foreground.png
    - assets/icons/app_icon_background.png
    - assets/icons/splash_branding_footer.png
    - assets/icons/splash_icon_android12.png
    - assets/legal/
    - assets/media/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  adaptive_icon_background: "assets/icons/app_icon_background.png"
  adaptive_icon_foreground_inset: 20
  remove_alpha_ios: true

flutter_native_splash:
  color: "#00489B"
  image: "assets/icons/app_icon.png"
  branding: "assets/icons/splash_branding_footer.png"

  android_12:
    color: "#00489B"
    image: "assets/icons/app_icon.png"
    branding: "assets/icons/splash_branding_footer.png"
