name: prokat
description: "Equipment renting platform in Kazakhstan"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.13+5

environment:
  sdk: ^3.13.0
  flutter: 3.47.2

dependencies:
  flutter:
    sdk: flutter
  flutter_markdown: ^0.7.3

  flutter_localizations:
    sdk: flutter

  go_router: ^18.0.0
  geolocator: ^14.0.3

  mapbox_maps_flutter: ^2.29.1
  permission_handler: ^13.0.1

  # HTTP client
  dio: ^5.11.0

  # secure token storage
  flutter_secure_storage: ^11.0.0

  # state management
  flutter_riverpod: ^2.5.1

  # utilities
  intl: ^0.20.2
  cached_network_image: ^4.0.0
  lucide_icons_flutter: ^3.1.17
  shimmer: ^4.0.0
  url_launcher: ^6.3.2
  socket_io_client: ^3.1.6
  image_picker: ^1.2.3
  image_cropper: ^12.2.1
  pinput: ^6.0.2
  mask_text_input_formatter: ^2.9.0
  firebase_core: ^4.14.0
  firebase_app_check: ^0.4.7
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0
  package_info_plus: ^10.2.1
  uuid: ^4.6.0
  firebase_crashlytics: ^5.3.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

  change_app_package_name: ^1.5.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/app_icon.png
    - assets/icons/app_icon_foreground.png
    - assets/icons/app_icon_background.png
    - assets/icons/splash_branding_footer.png
    - assets/icons/splash_branding_footer_wt.png
    - assets/icons/splash_logo.png
    - assets/icons/splash_icon_android12.png
    - assets/icons/map_marker.png
    - assets/legal/
    - assets/media/
    - assets/catalog/catalog_bundle.json

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  adaptive_icon_background: "assets/icons/app_icon_background.png"
  adaptive_icon_foreground_inset: 20
  remove_alpha_ios: true

flutter_native_splash:
  color: "#00489B"
  image: "assets/icons/splash_logo.png"
  branding: "assets/icons/splash_branding_footer_wt.png"

  android_12:
    color: "#00489B"
    image: "assets/icons/splash_logo.png"
    branding: "assets/icons/splash_branding_footer_wt.png"
