name: Pull request checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  DART_SUPPRESS_ANALYTICS: true
  FLUTTER_SUPPRESS_ANALYTICS: true

jobs:
  quality:
    name: Format, localization, and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Check patch whitespace
        run: git diff --check

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Check localization drift
        run: git diff --exit-code -- lib/l10n

      - name: Analyze
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings

      - name: Check generated worktree drift
        run: git diff --exit-code

  test:
    name: Unit and widget tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run tests without external services
        run: >-
          flutter test --no-pub --reporter expanded
          --dart-define=ENABLE_FIREBASE_SERVICES=false
          --dart-define=ENABLE_PUSH_NOTIFICATIONS=false
