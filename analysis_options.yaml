# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
  errors:
    # Surface these as warnings so they stay visible in the Problems panel.
    prefer_const_constructors: warning
    prefer_const_declarations: warning
    prefer_const_literals_to_create_immutables: warning
    use_build_context_synchronously: warning
    unawaited_futures: warning
    discarded_futures: warning

linter:
  rules:
    # Const constructors were dropped from flutter_lints 5+. Re-enable so
    # widgets and other immutable values get a cheap identity/rebuild win.
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    # Already in flutter_lints; keep explicit. Requires mounted after an
    # async gap before using BuildContext.
    use_build_context_synchronously: true
    # unawaited_futures: async bodies must await or wrap with unawaited(...).
    # discarded_futures: the same in sync functions and callbacks.
    unawaited_futures: true
    discarded_futures: true
